; ESP32 Plane Radar — 1.28" round GC9A01 (240x240)
;
; Boards:
;   esp32_2424s012  ESP32-2424S012 (ESP32-C3, built-in round display)   <- default
;   xiao_esp32c3    Seeed Studio XIAO ESP32C3 + GC9A01 module
;   d1_mini32       ESP32-D1 mini (WEMOS/LOLIN D1 mini ESP32) + GC9A01 module
;
; Build/upload one board:  pio run -e esp32_2424s012 -t upload

[platformio]
default_envs = esp32_2424s012

; Settings shared by all boards
[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ESP32-2424S012: ESP32-C3 with native USB (USB-C), GC9A01 on SPI, BOOT = GPIO9.
; To enter download mode manually: hold BOOT, press RESET (or replug USB).
[env:esp32_2424s012]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32_2424S012
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed Studio XIAO ESP32C3: native USB (USB-C), BOOT = GPIO9 (D9).
; Wiring: SCL=D8, SDA=D10, CS=D0, DC=D1, RST=D2, VCC=3V3, GND=GND.
[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_ESP32C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-D1 mini (USB-UART bridge, no native-USB flags needed).
[env:d1_mini32]
board = wemos_d1_mini32
upload_speed = 460800
